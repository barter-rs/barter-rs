# release-plz configuration
# This configuration creates individual changelogs for each crate in the workspace

[workspace]
# Disable workspace-level changelog
changelog_update = false

# Individual package configurations
[[package]]
name = "trading-bot-runtime"
changelog_path = "crates/runtime/CHANGELOG.md"

[[package]]
name = "trading-bot-market"
changelog_path = "crates/market/CHANGELOG.md"

[[package]]
name = "trading-bot-execution"
changelog_path = "crates/execution/CHANGELOG.md"

[[package]]
name = "trading-bot-instrument"
changelog_path = "crates/instrument/CHANGELOG.md"

[[package]]
name = "trading-bot-integration"
changelog_path = "crates/integration/CHANGELOG.md"

[[package]]
name = "trading-bot-macro"
changelog_path = "crates/macro/CHANGELOG.md"