[package]
name = "trading-bot-macro"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/trapilot/rust-trading-bot"
description = "Trading Bot ecosystem macros"
keywords = ["trading", "backtesting", "crypto", "stocks", "investment"]
categories = ["accessibility", "simulation"]

[lib]
proc-macro = true

[dependencies]
# Macro
proc-macro2 = "1.0.49"
syn = "2.0.113"
quote = "1.0.23"

# Misc
convert_case = "0.6.0"
